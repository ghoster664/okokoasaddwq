<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pol33t Testosterone ED</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/fx.css"></head>
<body data-shop="1">
<div id="header"></div>
<div class="shop"><section class="view" id="view"></section><aside class="recs" id="recs"></aside></div>
<script src="js/products.js"></script><script src="js/app.js"></script>
<script>
const params = new URLSearchParams(location.search);
const cat = params.get("cat") || "All";
let current = null;
const qEl = document.getElementById("q");
const filtered = () => {
  const q = qEl.value.toLowerCase();
  return PRODUCTS.filter(p => (cat == "All" || p.category == cat) && (p.name + p.description).toLowerCase().includes(q));
};
function showProduct(id) {
  current = PRODUCTS.find(p => p.id == id);
  const v = document.getElementById("view");
  if (!current) { v.innerHTML = "<p class='muted'>No products found.</p>"; return; }
  v.innerHTML = `<img src="${current.image}" alt="${current.name}">
    <div><div class="muted">${current.category}</div><h1>${current.name}</h1>
    <div class="price">${money(current.price)}</div><p>${current.description}</p>
    <button class="btn" id="buy">Add to cart</button>
    <a class="btn alt" href="pages/cart.html" style="margin-left:8px;display:inline-block">Go to cart</a></div>`;
  const btn = document.getElementById("buy");
  const upd = () => btn.textContent = Cart.get()[current.id] ? "Remove from cart" : "Add to cart";
  btn.onclick = () => { Cart.get()[current.id] ? Cart.remove(current.id) : Cart.add(current.id); upd(); };
  upd();
}
function renderRecs() {
  const list = filtered();
  document.getElementById("recs").innerHTML = list.map(p =>
    `<div class="card" onclick="showProduct(${p.id})"><img src="${p.image}" alt=""><div>${p.name}</div><div class="muted">${money(p.price)}</div></div>`).join("");
  if (!list.find(p => p.id == (current && current.id))) showProduct(list.length ? list[0].id : null);
}
qEl.addEventListener("input", renderRecs);
renderRecs();
</script><script src="js/fx.js"></script></body></html>
