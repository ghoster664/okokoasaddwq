<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delivery status - Pol33t Testosterone ED</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/fx.css"></head>
<body data-root="../"><div id="header"></div>
<main class="page"><h1>Delivery status</h1><div id="orders"></div></main>
<script src="../js/products.js"></script><script src="../js/app.js"></script>
<script>
const o=Orders.get();
document.getElementById("orders").innerHTML=o.length?o.map(x=>`<div class=box><b>Order ${x.id}</b> <span class=muted>${x.date}</span><br>
  Status: <b style="color:var(--acc)">${x.status}</b><br>${x.items.join(", ")}<br>Total: ${money(x.total)}</div>`).join(""):"<p class=muted>No orders yet.</p>";
</script>
<script src="../js/fx.js"></script></body></html>
