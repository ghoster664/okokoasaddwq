<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopping cart - Pol33t Testosterone ED</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/fx.css"></head>
<body data-root="../"><div id="header"></div>
<main class="page"><h1>Shopping cart</h1><div id="cart"></div></main>
<script src="../js/products.js"></script><script src="../js/app.js"></script>
<script>
function draw(){
  const items=Cart.items(), el=document.getElementById("cart");
  if(!items.length){el.innerHTML="<p class=muted>Your cart is empty.</p>";return;}
  el.innerHTML="<table>"+items.map(i=>`<tr><td><img src="../${i.p.image}">${i.p.name}</td>
    <td class=qty><button onclick="Cart.setQty(${i.p.id},${i.q-1});draw()">-</button> ${i.q} <button onclick="Cart.setQty(${i.p.id},${i.q+1});draw()">+</button></td>
    <td>${money(i.p.price*i.q)}</td><td><button class=btn style="padding:6px 12px" onclick="Cart.remove(${i.p.id});draw()">Remove</button></td></tr>`).join("")+
    `</table><h2>Total: ${money(Cart.total())}</h2><button class=btn onclick="checkout()">Place order</button>
    <button class="btn alt" onclick="Cart.clear();draw()">Clear cart</button>`;
}
function checkout(){Orders.create();Cart.clear();nav("delivery.html");}
draw();
</script>
<script src="../js/fx.js"></script></body></html>
